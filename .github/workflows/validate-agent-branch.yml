name: Validate agent branch

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "hotfix/**"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser only (no --with-deps): the apt install stalled 14m45s and blew
      # the job timeout. Export render tests (export-builder, brand-export)
      # launch headless Chromium via export-surface-image.ts; ubuntu-latest
      # runners already ship the required system libraries. Mirrors ci.yml —
      # this step was missing here, so brand-export.test.ts's 30s render
      # timed out waiting for a Chromium that was never installed.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
